<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nova Social — Admin</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --bg: #07080E; --surface: rgba(255,255,255,0.045); --border: rgba(255,255,255,0.1);
    --text: #EEF0F6; --text-muted: rgba(238,240,246,0.62); --peach: #FEBE98; --peach-ink: #14151E;
    --font-heading: "Manrope", system-ui, sans-serif; --font-body: "Inter", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); min-height: 100vh; }
  a { color: var(--peach); }
  .wrap { max-width: 960px; margin: 0 auto; padding: 40px 24px 80px; }
  .topbar { display: flex; align-items: center; gap: 14px; margin-bottom: 36px; }
  .topbar img { height: 30px; }
  .topbar .spacer { margin-left: auto; }
  h1, h2 { font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.02em; margin: 0 0 8px; }
  .hint { color: var(--text-muted); font-size: 14px; margin: 0 0 24px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 28px; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .field label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); }
  .field input, .field textarea, .field select {
    background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); font: inherit; font-size: 15px; padding: 11px 13px; outline: none;
  }
  .field input:focus, .field textarea:focus { border-color: var(--peach); }
  .field textarea { resize: vertical; line-height: 1.55; }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font-family: var(--font-heading); font-weight: 700; font-size: 14.5px; border-radius: 999px;
    border: none; cursor: pointer; padding: 12px 22px; transition: transform 160ms ease, box-shadow 160ms ease, opacity 160ms ease;
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: var(--peach); color: var(--peach-ink); }
  .btn-primary:hover:not(:disabled) { transform: translateY(-1px); }
  .btn-ghost { background: rgba(255,255,255,0.06); color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover:not(:disabled) { border-color: var(--peach); }
  .btn-danger { background: rgba(255,90,90,0.12); color: #ff8a8a; border: 1px solid rgba(255,90,90,0.3); }
  .btn-danger:hover:not(:disabled) { background: rgba(255,90,90,0.2); }
  .error-msg { color: #ff8a8a; font-size: 14px; margin: 12px 0 0; }
  .status-msg { color: var(--peach); font-size: 14px; margin: 12px 0 0; }
  .tabs { display: flex; gap: 10px; margin-bottom: 24px; }
  .tab-btn {
    padding: 10px 18px; border-radius: 999px; border: 1px solid var(--border); background: rgba(255,255,255,0.04);
    color: var(--text); font-family: var(--font-heading); font-weight: 700; font-size: 14px; cursor: pointer;
  }
  .tab-btn.is-active { border-color: var(--peach); color: var(--peach); background: rgba(254,190,152,0.08); }
  .item-list { display: grid; gap: 16px; }
  .item-card { border: 1px solid var(--border); border-radius: 16px; padding: 22px; background: rgba(255,255,255,0.03); }
  .item-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .item-head .tag { font-family: monospace; font-size: 11px; letter-spacing: 0.08em; color: var(--text-muted); }
  .field.span-2 { grid-column: span 2; }
  .thumb-row { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
  .thumb-row img { width: 120px; height: 58px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }
  .thumb-row .no-image {
    width: 120px; height: 58px; border-radius: 8px; border: 1px dashed var(--border);
    display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--text-muted); flex: none;
  }
  .img-hint { font-size: 12.5px; color: var(--text-muted); margin: -8px 0 16px; }
  .file-label {
    padding: 9px 16px; border-radius: 999px; border: 1px solid rgba(254,190,152,0.4); background: rgba(254,190,152,0.1);
    color: var(--peach); font-family: var(--font-heading); font-weight: 700; font-size: 13px; cursor: pointer;
  }
  .file-label input { display: none; }
  [hidden] { display: none !important; }
  .center-screen { min-height: 70vh; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <img src="/assets/nova-logo-peach.png" alt="Nova Social" />
    <strong style="font-family:var(--font-heading);">Admin</strong>
    <div class="spacer"></div>
    <a href="/" style="font-size:14px;">&larr; Back to site</a>
  </div>

  <div id="view-loading" class="center-screen">
    <p class="hint">Loading…</p>
  </div>

  <div id="view-login" hidden>
    <div class="card" style="max-width:400px;margin:0 auto;">
      <h2>Sign in</h2>
      <p class="hint">Manage Our Work campaigns and Insights articles.</p>
      <form id="login-form">
        <div class="field"><label>Email</label><input type="email" id="login-email" required autocomplete="username" /></div>
        <div class="field"><label>Password</label><input type="password" id="login-password" required autocomplete="current-password" /></div>
        <button type="submit" class="btn btn-primary" style="width:100%;" id="login-submit">Sign in</button>
        <p class="error-msg" id="login-error" hidden></p>
      </form>
    </div>
  </div>

  <div id="view-dashboard" hidden>
    <div class="tabs">
      <button type="button" class="tab-btn is-active" data-tab="campaigns">Our Work · <span id="campaign-count">0</span></button>
      <button type="button" class="tab-btn" data-tab="articles">Insights · <span id="article-count">0</span></button>
      <div class="spacer"></div>
      <button type="button" class="btn btn-ghost" id="logout-btn">Log out</button>
    </div>

    <div id="tab-campaigns">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
        <p class="hint" style="margin:0;">These appear in "Our Work" on the live site. Click Save on a card after editing it.</p>
        <button type="button" class="btn btn-primary" id="add-campaign">+ Add campaign</button>
      </div>
      <div class="item-list" id="campaign-list"></div>
    </div>

    <div id="tab-articles" hidden>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
        <p class="hint" style="margin:0;">These appear in "Insights" on the live site, ordered by the Order field (lower first).</p>
        <button type="button" class="btn btn-primary" id="add-article">+ Add article</button>
      </div>
      <div class="item-list" id="article-list"></div>
    </div>
  </div>
</div>

<script src="/admin/admin.js"></script>
</body>
</html>
