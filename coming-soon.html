<style>
  :root {
    --bg: #07080E; --text: #EEF0F6; --text-muted: rgba(238,240,246,0.66);
    --peach: #FEBE98; --peach-hover: #FFD8BE; --peach-ink: #14151E; --purple: #4F5277;
    --font-heading: "Manrope", system-ui, sans-serif; --font-body: "Inter", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body);
    -webkit-font-smoothing: antialiased; display: flex; align-items: center; justify-content: center;
    padding: 24px; position: relative; overflow-x: hidden;
  }
  .bg-glow { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .bg-glow span { position: absolute; border-radius: 50%; filter: blur(30px); }
  .glow-a {
    top: -18vh; left: 52%; width: 62vw; height: 62vw;
    background: radial-gradient(circle, rgba(254,190,152,0.16), rgba(254,190,152,0) 65%);
    animation: drift 26s ease-in-out infinite;
  }
  .glow-b {
    top: 38vh; left: -18vw; width: 55vw; height: 55vw;
    background: radial-gradient(circle, rgba(79,82,119,0.45), rgba(79,82,119,0) 68%);
    animation: drift 34s ease-in-out infinite reverse;
  }
  @keyframes drift { 0%,100% { transform: translate3d(0,0,0) scale(1); } 50% { transform: translate3d(4%,-3%,0) scale(1.12); } }
  @media (prefers-reduced-motion: reduce) { .glow-a, .glow-b { animation: none; } }

  .card {
    position: relative; z-index: 1; width: 100%; max-width: 560px;
    padding: 56px 44px; border-radius: 26px; text-align: center;
    border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05);
    backdrop-filter: blur(22px) saturate(140%); -webkit-backdrop-filter: blur(22px) saturate(140%);
    box-shadow: 0 40px 100px rgba(0,0,0,0.45);
  }
  .logo { height: 64px; width: auto; margin: 0 auto 28px; display: block;
    filter: drop-shadow(0 0 8px rgba(254,190,152,0.75)) drop-shadow(0 0 22px rgba(254,190,152,0.6)) drop-shadow(0 0 48px rgba(254,190,152,0.42));
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px; padding: 7px 14px 7px 10px;
    border-radius: 999px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04);
    font-size: 13px; color: rgba(238,240,246,0.72); margin-bottom: 26px;
  }
  .eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--peach); }
  h1 {
    font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.02em;
    font-size: clamp(28px, 5vw, 38px); line-height: 1.1; margin: 0 0 16px;
  }
  p.lede { font-size: 16.5px; line-height: 1.65; color: var(--text-muted); margin: 0 0 36px; }
  .socials { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 8px; }
  .socials a {
    display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px;
    border-radius: 999px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.04);
    color: var(--text); text-decoration: none; font-family: var(--font-heading); font-weight: 600; font-size: 14.5px;
    transition: border-color 220ms ease, background 220ms ease, transform 220ms ease;
  }
  .socials a:hover {
    border-color: rgba(254,190,152,0.55); background: rgba(254,190,152,0.08);
    color: var(--peach-hover); transform: translateY(-2px);
  }
  .socials svg { width: 16px; height: 16px; display: block; }
  footer { position: relative; z-index: 1; margin-top: 28px; font-size: 13px; color: rgba(238,240,246,0.4); text-align: center; }
</style>
