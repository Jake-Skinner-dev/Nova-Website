---
# cPanel Git Version Control deployment file — LIVE (main branch).
#
# This deploys to www.novasocial.co.uk's document root. The `dev` branch has
# its own separate .cpanel.yml pointing at the dev.novasocial.co.uk subdomain
# instead — the two never conflict because each cPanel Git Version Control
# repo clone tracks one branch and runs whatever .cpanel.yml is checked out
# on it.
#
# This copies the pre-built dist/ folder into public_html. It never deletes
# existing files in public_html, so anything already there (other sites,
# subfolders, existing email-related files, etc.) is left alone —
# matching/duplicate filenames are simply overwritten.
deployment:
  tasks:
    - export DEPLOYPATH=/home/o5l9nmc9gw7j/public_html/
    - /bin/cp -R dist/. $DEPLOYPATH
