---
# cPanel Git Version Control deployment file for Nova Brief.
#
# Nova Brief deploys to its OWN subdomain document root, separate from the
# parent Nova Social site. Set this up as a SECOND cPanel Git Version
# Control clone of this repository:
#   Repository Path : /home/o5l9nmc9gw7j/repositories/Nova-Brief  (the git
#                     checkout; .cpanel.yml runs from here)
#   DEPLOYPATH below : the document root the web server serves for
#                     brief.novasocial.co.uk
#
# This copies the pre-built brief/dist/ folder into that document root and
# never deletes anything already there.
deployment:
  tasks:
    - export DEPLOYPATH=/home/o5l9nmc9gw7j/public_html/brief.novasocial.co.uk
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R brief/dist/. $DEPLOYPATH/
    # dist/ already contains .htaccess (copied from brief/public/ at build);
    # re-copy it explicitly as a belt-and-braces in case Vite skipped the
    # dotfile. Note the slash before .htaccess.
    - /bin/cp brief/public/.htaccess $DEPLOYPATH/.htaccess || true
