<section aria-labelledby="newsletter-heading" data-reveal>
  <div class="container">
    <div class="newsletter-panel">
      <div>
        <h2 id="newsletter-heading">Get the Nova Brief.</h2>
        <p>The biggest marketing stories, campaigns and stats delivered straight to your inbox. No waffle.</p>
      </div>
      <form class="newsletter-form" id="newsletter-form" novalidate>
        <label class="visually-hidden" for="newsletter-email">Email address</label>
        <input type="email" id="newsletter-email" name="email" placeholder="you@company.com" autocomplete="email" required />
        <button type="submit" class="btn btn--peach" id="newsletter-submit">Get the Brief</button>
        <p class="form-note">One email, when it matters. Unsubscribe anytime.</p>
        <p class="form-msg" id="newsletter-msg" hidden></p>
      </form>
    </div>
  </div>
</section>
