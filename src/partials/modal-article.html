<!-- Article modals -->
<div class="modal-backdrop" id="article-backdrop" data-close-on-backdrop>
  <div class="modal modal--article" role="dialog" aria-modal="true" aria-labelledby="article-modal-title">
    <button type="button" class="modal-close" data-close-modal aria-label="Close article">&#215;</button>
    <div class="modal-body">
      <div class="article-meta">
        <span class="category" id="article-category"></span>
        <span id="article-date"></span>
      </div>
      <h2 id="article-modal-title"></h2>
      <p class="article-dek" id="article-dek"></p>
      <div class="article-divider"></div>
      <div class="article-body" id="article-body"></div>
      <div class="article-footer">
        <p>Want this looked at for your own brand?</p>
        <div class="row">
          <button type="button" class="btn-primary-pill" data-open-contact>Start A Conversation</button>
          <button type="button" class="btn-secondary-pill" data-close-modal>Close</button>
        </div>
      </div>
    </div>
  </div>
</div>
